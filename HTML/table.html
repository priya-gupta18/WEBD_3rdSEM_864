<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Table</title>
</head>
<body>
    <table border="2">
        <tr>
            <th rowspan="3">Day</th>
            <th colspan="4">Seminar</th>
        </tr>
        <tr>
            <th colspan="2">Schedule</th>
            <th colspan="2">Topic</th>
        </tr>
        <tr>
            <th>Begin</th>
            <th>End</th>
        </tr>
        <tr>
            <td rowspan="2">Monday</td>
            <td rowspan="2">8pm</td>
            <td rowspan="2">5pm</td>
            <td> Introduction to XML</td>
        </tr>
        <tr>
            <td>Validity DTC and Relax NG</td>
        </tr>
        <tr>
            <td rowspan="3">Tuesday</td>
            <td>8am</td>
            <td>11am</td>
            <td rowspan="2">XPath</td>
        </tr>
        <tr>
            <td>11pm</td>
            <td>2pm</td>
        </tr>
        <tr>
            <td>2pm</td>
            <td>5pm</td>
            <td>XSL Transformation</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>8pm</td>
            <td>12pm</td>
            <td>XSL Formatting Objects</td>
        </tr>

    </table>
</body>
</html>
