<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <center>
    <h2>Student Registration Form</h2>
<form>
    <table cellpadding="8">
        <tr>
            <td>Roll No.</td>
            <td><input type="text" name="roll"></td>
        </tr>
        <tr>
            <td>Student Name</td>
            <td>
                <input type="text" placeholder="First Name">
                <input type="text" placeholder="Last Name">
            </td>
        </tr>
        <tr>
            <td>Father's Name</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td>Date of Birth</td>
            <td>
                <select>
                    <option>Day</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                </select>
                <select>
                    <option>Month</option>
                    <option>Jan</option>
                    <option>Feb</option>
                    <option>Mar</option>
                    <option>Apr</option>
                </select>
                <select>
                    <option>Year</option>
                    <option>2000</option>
                    <option>2001</option>
                    <option>2002</option>
                    <option>2003</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>Mobile No.</td>
            <td>
                <input type="text" value="+91" size="3">
                <input type="text">
            </td>
        </tr>

        <tr>
            <td>Email Id</td>
            <td><input type="email"></td>
        </tr>

        <tr>
            <td>Password</td>
            <td><input type="password"></td>

        </tr>

        <tr>
            <td>Gender</td>
            <td>
                <input type="radio" name="gender">Male
                <input type="radio"name="gender">Female
            </td>
        </tr>

        <tr>
            <td>Department</td>
            <td>
                <input type="checkbox">CSE
                <input type="checkbox">IT
                <input type="checkbox">ECE
                <input type="checkbox">Civil
                <input type="checkbox">Mech
            </td>
        </tr>
        <tr>
        <td>Course</td>
        <td>
            <select>
                <option>Select Current Course</option>
                <option>B.Tech</option>
                <option>BCA</option>
                <option>B.Sc</option>
                <option>MCA</option>
            </select>
        </td>
        </tr>

        <tr>
            <td>Student Photo</td>
            <td>
                <input type="file">
            </td>
        </tr>
        <tr>
            <td>City</td>
            <td>
                <textarea rows="4" cols="25"></textarea>
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <input type="submit" value="Registar">
            </td>
        </tr>
    </table>
</form>
    </center>
    
</body>
</html>
